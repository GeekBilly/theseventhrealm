<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════════
 姓氏线（B 线）· 手机 **3:4 方版**模板 v11-square · 基准 1179×1572
   · 用途：小红书笔记配图（小红书信息流标准比例 3:4）
   · 与 `模板-姓氏-v11-竖版.html`（1080×1920 基准，9:16/19.5:9）的关系：
     同一套七区位、同一套顺序，但**纵向预算整体重排**，不是裁切、也不是等比缩放。

 为什么不能直接裁 9:16 的图：
   9:16 → 3:4 要砍掉 38% 的画幅高。裁上部会切掉标题，裁下部会切掉落款和品牌行，
   保中间则四格挤在一起。用户第二篇小红书发的是 16 张朝代壁纸（1179×1572），
   那是横向宽 1179 不变、纵向只有 1572 —— 四格必须重新分配高度。

 为什么单独一份文件而不做 variant 缩放：
   生成器的缩放手径是「横向一切 × kx、纵向锚点 × ky」。9:19.5 时 ky/kx≈1.22（纵向富余），
   3:4 时 ky/kx≈0.75（纵向**紧 25%**）—— 同一套字号公式会直接把四格撑破。
   ⇒ 3:4 的版式预算在这里手写死（quat 246~202、字号 188），生成器**不做任何缩放**。

 七个区位（与竖版同构）：
   ① 左上角系列标 .series-tag   「姓 氏 源 流 · {姓}」
   ② 画心上方标题两行 .series   「一 姓 四 体 · 三 千 年」+「自 上 而 下 · 自 草 书 至 碑 刻」
   ③ 画心 .quat                 纵向四格，**自上而下 = 草书 | 行书 | 隶书 | 碑刻**
   ④ 右侧竖排金句 .quote + 出处 .src（底边与金句盒底齐平，同桌面版口径）
   ⑤ 左侧竖排列款 .colophon     第七境 + 朱砂点 + 印章
   ⑥ 正下中品牌行 .brand-block
   ⑦ 品牌行上方 .meta            拼音 + {简}/{繁} · 源流{朝代} · {年份}

 纵向分配（基准 1572）：
   tag 顶 56 / title 顶 140 / quote·src 顶 330 / quat 246～1370(bottom 202)
   / meta 底 150 / brand 底 62 / colophon 顶 990

 🔴 与竖版共用的三条硬约束：
   · 'serif' 被 @font-face 占成思源宋体 **Black**，小字不要用 'serif'
   · 不引外链 webfont（同一份 HTML 两次出图小字不同，批量必翻车）
   · 四格顺序由**生成器**决定（tpl=='square' 时 reversed(ORDER4)），body 示例须一致
   ⚠️ 本注释块里不许出现完整的注释定界符字面量，否则大注释被提前闭合 → 整幅下移
════════════════════════════════════════════════════════════════════════════
-->

<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'serif';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/fonts/NotoSerifSC-Black.ttf')}
@font-face{font-family:'lishu';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/隶书/aoyagireisyosimo_ttf_2_01.ttf')}
@font-face{font-family:'lishu2';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/隶书/AlimamaDaoLiTi-Regular-简体.ttf')}
@font-face{font-family:'xing';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/fonts/挚芒行.ttf')}
@font-face{font-family:'cao';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/fonts/柳建毛草.ttf')}
@font-face{font-family:'msz';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf')}
:root{
  --ink:#1a1a18; --ink2:#54504a; --cinnabar:#b03826;
  --f-body:'Noto Serif SC',Georgia,serif;
  --f-brush:'msz','Ma Shan Zheng Local','Ma Shan Zheng','KaiTi',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1179px;height:1572px;overflow:hidden;background:#ffffff}
body{color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1179px;height:1572px;overflow:hidden}

/* ① 左上角系列标 */
.series-tag{position:absolute;left:76px;top:56px;z-index:6;
  font-family:var(--f-body);font-size:24px;letter-spacing:8px;color:#6b675f;
  text-indent:8px}

/* ② 画心上方标题两行 */
.series{position:absolute;left:589px;top:132px;transform:translateX(-50%);z-index:6;
  text-align:center;white-space:nowrap}
.series .t{font-family:var(--f-body);font-size:30px;letter-spacing:13px;color:#24221d;
  text-indent:13px}
.series .h{margin-top:16px;font-family:var(--f-body);font-size:19px;letter-spacing:6px;
  color:#5a564e;text-indent:6px}

/* ④ 右侧竖排金句：一列 4 字 */
.quote{position:absolute;right:70px;top:330px;display:flex;gap:20px;
  align-items:flex-start;z-index:5}
.vc{display:flex;flex-direction:column;align-items:center;width:62px}
.vc span{font-family:var(--f-brush);font-size:54px;line-height:1.6;color:var(--ink)}
/* 出处：金句左侧一列（right = 70 + 62 + 20 = 152）
   ⭐ 桌面版口径：**底边与金句盒底齐平**
      金句盒底 = 330 + 4×(54×1.6) = 675.6；出处列高 ≈ 11×(20+字距7) = 297
      ⇒ top = 675.6 − 297 ≈ 379
   ⚠️ 不要写成与 .quote 同 top（那是顶边齐平，出处会吊在上面） */
.src{position:absolute;right:152px;top:379px;writing-mode:vertical-rl;
  font-family:var(--f-body);font-size:20px;letter-spacing:7px;line-height:1.6;
  color:#4a463f;z-index:5}

/* ③ 画心四联字区：纵向四格，自上而下 = 草书 | 行书 | 隶书 | 碑刻（生成器决定顺序）
      预算：可用高 = 1572 − 236 − 228 = 1108
            扣 3 道线(37×3=111) 与 4 组标签(54×4=216) ⇒ 字号 ≈ 184
      ⚠️ .ch 的 height 必须 = 字号 × line-height（184×1.06≈195）——
         写成与字号同值会让行盒比字矮、标签压住字底（2026-10-21 首版就是这个毛病） */
.quat{position:absolute;left:589px;top:236px;bottom:228px;transform:translateX(-50%);
  z-index:5;display:flex;flex-direction:column;align-items:center;
  justify-content:center}
.cell{text-align:center;position:relative}
.cell .ch{font-size:184px;line-height:1.06;color:#1a1a18;height:195px}
.cell .lb{margin-top:8px;font-family:var(--f-body);font-size:17px;letter-spacing:5px;
  color:#7f796d;text-indent:5px;white-space:nowrap}
.cell .lb b{display:block;font-weight:400;font-size:12px;letter-spacing:3px;
  color:#a8a092;margin-top:5px;text-indent:3px}
.divider{width:218px;height:1px;background:#ded7c9;margin:18px auto;flex:0 0 auto}

/* ⑦ 品牌行上方「拼音 + 年代」
   ⚠️ 2026-10-21 修正：原 bottom:130 与 .brand-block 的顶边（1572−52−80=1440）
      正好零间隙，四行读成一块。现按 22 / 28 / 29 的节奏分配：
      拼音→源流 22｜源流→第七境 28｜第七境→域名 29｜域名下留白 48 */
.meta{position:absolute;left:589px;bottom:150px;transform:translateX(-50%);z-index:5;
  text-align:center;font-family:Georgia,'Times New Roman',serif}
.meta .en{font-size:20px;letter-spacing:7px;color:#4a463f;text-transform:uppercase;
  text-indent:7px}
.meta .sub{margin-top:14px;font-size:16px;letter-spacing:4px;color:#6b675f;
  font-family:var(--f-body);line-height:1.4;text-indent:4px}

/* ⑤ 左侧竖排列款 + 钤印 */
.colophon{position:absolute;left:60px;top:990px;z-index:6;
  display:flex;flex-direction:column;align-items:center}
.vstack span{display:block;text-align:center;font-family:var(--f-brush);
  font-size:38px;line-height:1.4;color:var(--ink)}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--cinnabar);
  margin:13px 0 12px}
.colophon-seal{height:64px;opacity:.95}

/* ⑥ 正下中品牌行 */
.brand-block{position:absolute;left:589px;bottom:46px;transform:translateX(-50%);
  z-index:6;text-align:center}
.brand-cn{font-family:var(--f-brush);font-size:36px;letter-spacing:4px;color:#26241f;
  margin-right:-4px}
.brand-cn .tm{font-family:Georgia,'Times New Roman',serif;font-size:24px;
  vertical-align:super;letter-spacing:0;margin-left:4px;color:var(--ink)}
.brand-url{margin-top:20px;font-family:Georgia,'Times New Roman',serif;font-size:20px;
  letter-spacing:3px;color:#6b675f;text-indent:3px}
</style>
</head>
<body>
<div class="stage">

  <div class="series-tag">姓 氏 源 流 · 柳</div>

  <div class="series"><div class="t">一 姓 四 体 · 三 千 年</div>
    <div class="h">自 上 而 下 · 自 草 书 至 碑 刻</div></div>

  <div class="quat"><div class="cell"><div class="ch" style="font-family:'cao';font-size:184px;height:195px">柳</div><div class="lb">草书<b>柳建毛草</b></div></div><div class="divider"></div><div class="cell"><div class="ch" style="font-family:'xing';font-size:184px;height:195px">柳</div><div class="lb">行书<b>挚芒行</b></div></div><div class="divider"></div><div class="cell"><div class="ch" style="font-family:'lishu';font-size:184px;height:195px">柳</div><div class="lb">隶书<b>青柳隷書</b></div></div><div class="divider"></div><div class="cell"><div class="ch" style="font-family:'serif';font-size:184px;height:195px">柳</div><div class="lb">碑刻<b>Noto Serif</b></div></div></div>

    <div class="vstack"><span>第</span><span>七</span><span>境</span></div>

  <div class="brand-block"><div class="brand-cn">第七境<span class="tm">™</span></div>
    <div class="brand-url">www.theseventhrealm.com</div></div>

</div>
