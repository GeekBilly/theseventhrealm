<!DOCTYPE html>
<html lang="zh-CN">
<!--
 百家姓封面 v1 · 版 A「四姓大字」1179×1572（小红书 3:4）
 配色与排版沿用 A 线《模板-朝代-v9-竖版》：宣纸白 / 墨 / 朱砂 / 宣鸟底纹 / 落款印章
 新增的只有两处：① 顶部毛笔钩子句 ② 2×2 四姓大字（原单字卡是一姓一图）
-->
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Noto Serif SC Black Local';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/nssc-black.woff2') format('woff2');
  font-weight:900}
@font-face{font-family:'msz';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf') format('truetype')}

:root{--white:#ffffff;--ink:#1a1a18;--ink2:#54504a;--cinnabar:#b03826;
  --f-brush:'msz','Ma Shan Zheng',serif;--f-body:'Noto Serif SC',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1179px;height:1572px;overflow:hidden;background:var(--white)}
.stage{position:relative;width:1179px;height:1572px;background:#fff;overflow:hidden}

.texture{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.32;pointer-events:none;filter:grayscale(100%) contrast(.96);
  -webkit-mask-image:radial-gradient(ellipse 88% 62% at 52% 40%,#000 55%,transparent 100%);
  mask-image:radial-gradient(ellipse 88% 62% at 52% 40%,#000 55%,transparent 100%)}

.series-tag{position:absolute;left:64px;top:60px;z-index:2;
  font-family:var(--f-body);font-size:22px;letter-spacing:7px;color:#6b675f;text-indent:7px}

/* 钩子层：毛笔字，朝代模板里没有 —— 新增 */
.hook{position:absolute;left:589px;top:168px;transform:translateX(-50%);z-index:2;text-align:center;white-space:nowrap}
.hook-main{font-family:var(--f-brush);font-size:52px;letter-spacing:4px;color:var(--ink);line-height:1.3}
.hook-sub{margin-top:14px;font-family:var(--f-body);font-size:19px;letter-spacing:6px;color:#5a564e;text-indent:6px}

/* 主画心：2×2 四姓大字 */
.grid{position:absolute;left:589px;top:330px;transform:translateX(-50%);z-index:2;
  display:grid;grid-template-columns:repeat(2,auto);gap:70px 96px;justify-items:center}
.cell{position:relative;text-align:center}
.big{font-family:'Noto Serif SC Black Local','Songti SC',serif;font-weight:900;
  font-size:300px;line-height:1.02;color:var(--ink)}
.cap{margin-top:14px;font-family:var(--f-body);font-size:22px;letter-spacing:5px;
  color:#3d3931;text-indent:5px;white-space:nowrap}
.sub{margin-top:7px;font-family:var(--f-body);font-size:16px;letter-spacing:3px;
  color:#78736a;text-indent:3px;white-space:nowrap}
.cinnabar-dot{position:absolute;right:8px;top:22px;width:15px;height:15px;border-radius:50%;
  background:var(--cinnabar);box-shadow:14px 18px 0 -6px rgba(176,56,38,.35)}

/* 落款 */
.colophon{position:absolute;left:56px;bottom:300px;z-index:3;display:flex;flex-direction:column;align-items:center}
.vstack span{display:block;text-align:center;font-family:var(--f-brush);font-size:38px;line-height:1.4;color:var(--ink)}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--cinnabar);margin:13px 0 12px}
.colophon-seal{height:64px;opacity:.95}

.brand-block{position:absolute;left:589px;bottom:96px;transform:translateX(-50%);z-index:3;text-align:center}
.brand-cn{font-family:var(--f-brush);font-size:36px;letter-spacing:4px;color:#26241f}
.brand-cn .tm{font-family:Georgia,'Times New Roman',serif;font-size:24px;vertical-align:super;letter-spacing:0;margin-left:4px;color:var(--ink)}
.brand-url{margin-top:12px;font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:3px;color:#6b675f;text-indent:3px}
</style>
</head>
<body>
<div class="stage">
  <div class="series-tag">上 下 五 千 年 · 姓 氏</div>

  <div class="hook">
    <div class="hook-main">你的姓，三千年前长这样</div>
    <div class="hook-sub">第 一 期 · 赵 钱 孙 李</div>
  </div>

  <div class="grid">
    <div class="cell"><div class="big">赵</div><div class="cinnabar-dot"></div>
      <div class="cap">赵 · 赵武灵王</div><div class="sub">战国赵国君 · 胡服骑射</div></div>
    <div class="cell"><div class="big">钱</div><div class="cinnabar-dot"></div>
      <div class="cap">钱 · 钱镠</div><div class="sub">吴越开国君 · 修钱塘海塘</div></div>
    <div class="cell"><div class="big">孙</div><div class="cinnabar-dot"></div>
      <div class="cap">孙 · 孙武</div><div class="sub">兵家之祖 · 著孙子兵法</div></div>
    <div class="cell"><div class="big">李</div><div class="cinnabar-dot"></div>
      <div class="cap">李 · 李广</div><div class="sub">西汉飞将军 · 抗击匈奴</div></div>
  </div>

  <div class="colophon">
    <div class="vstack"><span>第</span><span>七</span><span>境</span></div>
    <div class="vdot"></div>
    <img class="colophon-seal" src="file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/底纹/seal.png">
  </div>

  <div class="brand-block">
    <div class="brand-cn">第七境<span class="tm">™</span></div>
    <div class="brand-url">www.theseventhrealm.com</div>
  </div>
</div>
</body>
</html>
