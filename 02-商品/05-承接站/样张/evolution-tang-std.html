   小字字体（系列标 / 画心标题 / 格下小字 / 出处 / 年代）
     本模板      `--f-body:'Noto Serif SC',Georgia,serif` → 本机系统衬线**细体**

  ④ 画心三联字         盒 371→710，**中心 540**（画面正中）

【渲染流程】（唯一一条写不进 HTML 的规矩，因为它发生在 HTML 之外）
  1. 先按 2× 设备像素渲染 → 3840×2160
  2. 再用 LANCZOS 缩回 1920×1080 —— 商周成品 std 图本身就是 4K 缩制品
     （实测：std 与「4K 缩回」差异 mean 0.59、墨量完全相同）
  3. 4K 档直接留第 1 步；Mac 档 1920×1248 同法 2× 得 3840×2496

【数据槽位清单】生成器用注释对定位替换（左括号写 S:xxx，右括号写 E:xxx）
  ⚠️⚠️ 本注释块里**不许**出现完整的 HTML 注释定界符字面量，否则大注释会被提前闭合、

  tag      左上角系列标文字

  quote    右上题跋 —— 固定**右起**：最左是 `.vc.src` 出处列，金句第一句贴最右。
           ⚠️ `.quote` 是 flex row，**DOM 顺序＝屏幕自左向右**，所以 DOM 里金句列是
           「第二句在前、第一句在后」（见下方默认样本：降而生商 → 天命玄鸟）。
           生成器拿到的数据是阅读顺序，由它 reversed() 后写入 —— 别再手工倒一遍。
  （底纹不是注释槽位：正文里那张 class 为 texture 的底纹图，其 src 由生成器在
    `</style>` 之后的正文里用正则替换 —— 因为注释标记塞进属性值会被当字面文本。
    ⚠️ 本注释块**不得**出现带真实文件名的底纹标签示例：曾因此让全文件替换命中注释、

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@font-face{
  font-family:'Noto Serif SC Black Local';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/nssc-black.woff2') format('woff2');
  font-weight:900;
}
@font-face{
  font-family:'Ma Shan Zheng Local';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf') format('truetype');
  font-weight:400;
}
/* 落款/金句字体：⭐ 把项目字体文件排链首，不依赖系统装没装 'Ma Shan Zheng'
   （2026-10-03 查明：母版成品落款/金句的字形＝马善政，与项目 MaShanZheng.ttf 骨架重合度 1.000） */
@font-face{font-family:'msz';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf') format('truetype')}
/* ⚠️⚠️ 这里**故意不引外链 webfont**（原 gen-wallpaper-classic.py 有一行
   @import fonts.loli.net 的 Noto Serif SC）。2026-10-03 实测：
     母版成品 png 的题头/出处小字 = **外链没加载成功**时的系统衬线兜底字形
     （「去掉 @import 重渲」与母版 png 在该区差异 mean 1.52、>60 仅 18 像素；
      而「外链加载成功」重渲则差 mean 10.04）；
     更麻烦的是外链**时通时不通** → 同一份 HTML 两次出图小字不同，100 张批量必翻车。
   → 结论：小字就用 --f-body 的原栈，让它确定性地走本机系统衬线兜底。 */
:root{
  --white:#ffffff; --ink:#1a1a18; --ink2:#54504a;
  --cinnabar:#b03826;
  --f-brush:'msz','Ma Shan Zheng Local','Ma Shan Zheng','KaiTi',serif;
  --f-body:'Noto Serif SC',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--white)}
.stage{position:relative;width:1920px;height:1080px;background:#fff;overflow:hidden}

/* ⑧ 底纹：整幅铺满，不做白色让渡，字直接压在上面 */
.texture{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.32;pointer-events:none;
  filter:grayscale(100%) contrast(.96);
  -webkit-mask-image:radial-gradient(ellipse 78% 72% at 52% 46%, #000 55%, transparent 100%);
  mask-image:radial-gradient(ellipse 78% 72% at 52% 46%, #000 55%, transparent 100%)}

/* ② 题头（三联正上方，无底衬，靠加深字色保证可读） */
.title-box{position:absolute;left:960px;top:262px;transform:translateX(-50%);z-index:2;
  text-align:center;white-space:nowrap}
.triple-title{font-family:var(--f-body);font-size:20px;letter-spacing:14px;color:#24221d;
  text-indent:14px}
.triple-hint{margin-top:13px;font-family:var(--f-body);font-size:14px;
  letter-spacing:7px;color:#4a463f;text-indent:7px}

/* ④ 画心：三联（真居中，画面正中） */
.triple{position:absolute;left:960px;top:371px;transform:translateX(-50%);
  display:flex;align-items:flex-end;gap:40px}
.cell{width:290px;text-align:center;position:relative}

/* 甲骨文（展卷最先看到，居右） */
.oracle-box{height:266px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.oracle-glyph{width:246px;height:246px;display:block}
/* ⚠️ 上面这两个尺寸只是**兜底默认值**：古文字尺寸每期不同（商 246 / 周 274），
   由生成器在标签上内联 style 覆盖。改这里不会影响成品 —— 要改尺寸请改
   gen-evolution.py 里 ERAS[*].ancient.size */
/* 古文字若用字体渲染而非 SVG（如后续期次），走这个类 */
.oracle-font{font-family:'AncientGlyph';font-size:246px;line-height:1;color:var(--ink)}
/* 中间：马善政毛笔 */
.brush-char{font-family:var(--f-brush);font-size:262px;line-height:1;color:var(--ink);margin-top:4px}
/* 展卷末尾（居左）：思源宋体 Black 碑刻 */
.song-char{font-family:'Noto Serif SC Black Local','Songti SC',serif;font-weight:900;
  font-size:262px;line-height:1;color:var(--ink);margin-top:4px}

.cell .cap{margin-top:22px;font-family:var(--f-body);font-size:17px;
  letter-spacing:9px;color:#3d3931;text-indent:9px}
.cell .sub{margin-top:9px;font-family:var(--f-body);font-size:13px;
  letter-spacing:5px;color:#6b675f;text-indent:5px}

/* 分隔：两道极细竖向断线 */
.divider{width:1px;height:200px;background:#ded7c9;margin-bottom:48px}

/* 朱砂点睛：落在画心正中（毛笔今文） */
.cinnabar-dot{position:absolute;right:26px;top:2px;
  width:17px;height:17px;border-radius:50%;background:var(--cinnabar);
  box-shadow:22px 26px 0 -8px rgba(176,56,38,.35)}

/* ③ 右起题跋：竖排金句（贴顶部菜单栏下沿，作为展卷起点） */
.quote{position:absolute;right:150px;top:62px;
  display:flex;gap:30px;align-items:flex-start;z-index:2}
.vc{display:flex;flex-direction:column;align-items:center;width:56px}
.vc span{font-family:var(--f-brush);font-size:54px;line-height:1.9;color:var(--ink)}
.vc.src{width:auto;margin-right:24px;align-self:flex-end;margin-bottom:-12px;
  padding-left:6px}
.vc.src span{font-family:var(--f-body);font-size:20px;line-height:1.8;color:#3d3931}
.vc.src .rot{display:block;transform:rotate(90deg);line-height:1}

/* ⑥ 左下角落款：中文竖排 + 朱砂点 + 印章（款识收尾钤印） */
.colophon{position:absolute;left:210px;bottom:140px;z-index:3;
  display:flex;flex-direction:column;align-items:flex-start}
.vstack{display:flex;flex-direction:column;align-items:center}
.vstack span{display:block;text-align:center}
.vstack.cjk span{font-family:var(--f-brush);font-size:40px;line-height:1.44;color:var(--ink)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--cinnabar);
  margin:16px 0 14px 14px;flex:0 0 auto}
.colophon-seal{height:70px;opacity:.95}

/* ⑦ 品牌落款：底部居中 */
.brand-block{position:absolute;left:960px;bottom:140px;transform:translateX(-50%);z-index:3;
  text-align:center;font-family:Georgia,'Times New Roman',serif}
.brand-en{font-size:33px;letter-spacing:9px;color:#26241f;text-transform:uppercase;
  text-indent:16px}
.brand-url{margin-top:13px;font-size:18px;letter-spacing:5px;color:#45423c;text-indent:5px}
/* 品牌行中文版 = **唯一正确口径**（2026-10-04 用户拍板，两线统一）
   ⭐ 依据：2026-10-02 品牌终局「方案① 中英分立」—— 中文产品落款只写
      「第七境™ + www.theseventhrealm.com」，**不许出现 TANTSE**（TANTSE 只在英文站／海外）。
      金句线当天已改；朝代线壁纸（shang-v9-std 等）漏跟进 → 本次 A/B 两线一并纠正。
   字号 40px = 左下角竖排落款 .vstack.cjk span 字号，字体同走 --f-brush（马善政），
      两处「第七境」品牌重量一致；字距 10px；text-indent 补偿末字后 letter-spacing 空隙。
   ⚠️ .brand-en（拉丁 Georgia 33px）**保留不删**：英文站／海外物料仍要用。 */
.brand-cn{font-size:40px;letter-spacing:10px;color:#26241f;line-height:1;
  font-family:var(--f-brush);font-weight:400;
  /* 水平：letter-spacing 在末字「境」后仍留 10px 空隙，居中会整体偏右
     → 负值 margin-right 抵消。实测 -4px 时墨迹中心 x≈967.5，
       与母版 TANTSE™ 的中心 x967.5 **完全一致**（注意母版本身就不是 960） */
  margin-right:-10px;
  /* 垂直：毛笔体墨迹占满 40px 行盒（拉丁大写只占 25px），底边会比母版低 7px
     → 补 10px 使**墨迹底边 y899 与母版严格一致**（顶边因汉字更高而自然上探）
     ⚠️ 必须用 padding 不能用 margin-bottom —— 相邻兄弟 .brand-url{margin-top:13px}
        会与之**margin 折叠**取 max(7,13)=13，等于没写 */
  padding-bottom:10px}

/* ⑤ 年代与英文（贴近 Dock，与左下角品牌块同一水平线） */
.era{position:absolute;left:960px;top:746px;transform:translateX(-50%);z-index:3;
  text-align:center;font-family:Georgia,'Times New Roman',serif}
.era .en{font-size:26px;letter-spacing:18px;color:#26241f;text-transform:uppercase}
.era .years{margin-top:14px;font-size:19px;letter-spacing:8px;color:#45423c}

/* ① 商品要素：系列小标 + 商标标识（原先由 gen-wallpaper-classic.py 注入，现并入本文件） */
.series-tag{position:absolute;left:210px;top:66px;z-index:2;
  font-family:var(--f-body);font-size:16px;letter-spacing:6px;color:#6b675f}
/* ™ 标识（2026-10-04 放大）：原 15px 且未指定字体 → 继承 .brand-cn 的毛笔体链，
   回退字形笔画极细，实测墨迹只有 10×6px（1920 档），缩到手机上看就是一团糊。
   → ① 显式走拉丁衬线 Georgia（与 .brand-url 同族，™ 字形正规）
     ② 字号 15→30px：™ 字形本身是扁宽的「小型大写」，Georgia 22px 时墨迹仅
        19×8px 仍偏糊，30px 才到 27×11px（汉字「第七境」高 41px）
     ③ 上标不用 vertical-align:super（上移量随父字号漂移）→ baseline + 相对位移，
        实测 top:-12px 时 ™ 墨迹顶 y858，与汉字行顶 y857 齐平、底 y868
     ④ .brand-cn 的 margin-right 随之由 -4px 收紧到 -10px，抵消 ™ 变宽后整块右移，
        使整行墨迹中心保持 **x967.5**（＝母版 TANTSE™ 的中心，母版本身就不是 960）
   实测（商/周/赵 × 1080 与 Mac 两档）：™ 27×11px、中心 967.5、顶与汉字齐平 */
.tm{font-family:Georgia,'Times New Roman',serif;font-size:30px;letter-spacing:0;
  margin-left:6px;vertical-align:baseline;position:relative;top:-12px;color:var(--ink)}
</style>
</head>

  <div class="series-tag">上 下 五 千 年 · 唐</div>
