<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
@font-face{font-family:'MSZ';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf')}
@font-face{font-family:'NSSC';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/fonts/NotoSerifSC-Black.ttf')}
@import url('https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap');
:root{--white:#fdfcf9;--ink:#1a1a18;--ink2:#6b675f;--cinnabar:#b03826;
 --f-brush:'MSZ','Ma Shan Zheng','Xingkai SC','STXingkai',serif;
 --f-body:'NSSC','Noto Serif SC',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1170px;height:2532px;overflow:hidden;background:var(--white)}
.stage{position:relative;width:1170px;height:2532px;background:
 radial-gradient(ellipse 900px 900px at 50% 40%, rgba(26,26,24,.022), transparent 70%),var(--white)}
/* 角上一枚淡墨印（不压主字） */
.ghost{position:absolute;left:17%;top:72%;transform:translate(-50%,-50%);
 font-family:var(--f-brush);font-size:360px;line-height:1;
 color:rgba(26,26,24,.06);user-select:none}
.hero-char{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);
 font-family:var(--f-brush);font-size:500px;line-height:1;color:var(--ink)}
/* 竖排金句：两列右起 */
.quote{position:absolute;right:150px;top:34%;transform:translateY(-50%);
 writing-mode:vertical-rl;font-family:var(--f-brush);font-size:60px;
 letter-spacing:30px;line-height:2.0;color:var(--ink)}
/* 出处竖排，独立一列在最右 */
.src{position:absolute;right:96px;top:34%;transform:translateY(-50%);
 writing-mode:vertical-rl;font-family:var(--f-body);font-size:28px;
 letter-spacing:6px;color:var(--ink2)}
.seal{position:absolute;right:96px;top:60%;width:140px;height:140px}
.sub{position:absolute;left:50%;top:60%;transform:translateX(-50%);
 font-family:var(--f-body);font-size:36px;letter-spacing:18px;color:var(--ink2);z-index:3}
.era{position:absolute;left:50%;bottom:270px;transform:translateX(-50%);z-index:3;
 text-align:center;font-family:Georgia,'Times New Roman',serif}
.era .en{font-size:34px;letter-spacing:12px;color:var(--ink);text-transform:uppercase}
.era .years{margin-top:20px;font-size:27px;letter-spacing:5px;color:var(--ink2)}
.mountains{position:absolute;left:0;bottom:0;width:100%;height:500px;z-index:2}
.mist{position:absolute;left:0;bottom:0;width:100%;height:400px;z-index:1}
.brand{position:absolute;left:88px;bottom:126px;z-index:3;font-family:var(--f-body);
 font-size:29px;letter-spacing:9px;color:var(--ink2)}
.brand b{font-family:var(--f-brush);font-weight:400;font-size:38px;letter-spacing:7px;color:var(--ink)}
.brand .dot{display:inline-block;width:13px;height:13px;border-radius:50%;
 background:var(--cinnabar);margin:0 16px 1px;vertical-align:middle}
.brand sup{font-size:.62em;letter-spacing:1px}
.cinnabar-dot{position:absolute;left:calc(50% + 228px);top:calc(37% - 238px);
 width:23px;height:23px;border-radius:50%;background:var(--cinnabar);
 box-shadow:20px 24px 0 -7px rgba(176,56,38,.32)}
</style></head><body><div class="stage">
  <div class="ghost">火</div>
  <div class="hero-char">五代十国</div>
  <div class="cinnabar-dot"></div>
  <div class="quote">春花秋月何时了，<br>往事知多少</div>
  <div class="src">李煜《虞美人》</div>
  <div class="sub">乱世烽火 · 斯文不坠</div>
  <img class="seal" src="file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/底纹/seal-hi.png">
  <div class="era"><div class="en">FIVE DYNASTIES</div><div class="years">AD 907 – 960</div></div>
  <svg class="mountains" viewBox="0 0 1200 340" preserveAspectRatio="none">
    <path d="M0,340 L0,238 Q160,180 320,214 Q420,232 520,196 Q650,150 760,196
             Q880,244 1010,208 Q1150,168 1200,206 L1200,340 Z" fill="rgba(26,26,24,.05)"/>
    <path d="M0,340 L0,282 Q220,246 380,268 Q540,290 700,262 Q860,236 1040,266
             Q1150,296 1200,264 L1200,340 Z" fill="rgba(26,26,24,.10)"/>
  </svg>
  <svg class="mist" viewBox="0 0 1200 260" preserveAspectRatio="none">
    <path d="M0,260 L0,150 Q240,96 470,140 Q700,184 930,132 Q1160,80 1200,128 L1200,260 Z"
          fill="rgba(26,26,24,.028)"/>
  </svg>
  <!-- 2026-10-02 方案①：去掉英文品牌 TANTSE，补上网址（桌面版原本没有网址） -->
  <div class="brand"><b>第七境</b><sup class="tm">TM</sup><span class="dot"></span>www.theseventhrealm.com</div>
</div></body></html>
