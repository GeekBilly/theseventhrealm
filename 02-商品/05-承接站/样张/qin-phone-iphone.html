<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
@font-face{font-family:'MSZ';src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf')}

:root{--white:#ffffff;--ink:#1a1a18;--ink2:#54504a;--cinnabar:#b03826;
 --f-brush:'MSZ','Ma Shan Zheng','KaiTi',serif;
 --f-song:'NSSC','Noto Serif SC','Songti SC',serif;
 --f-georgia:Georgia,'Times New Roman',serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1179px;height:2556px;overflow:hidden;background:var(--white)}
.stage{position:relative;width:1179px;height:2556px;overflow:hidden;background:var(--white)}
.paper{position:absolute;left:0;top:0;right:0;bottom:0;background:
 radial-gradient(ellipse 86% 46% at 50% 52%, rgba(26,26,24,.020), transparent 72%)}
.series{position:absolute;left:50%;top:665px;transform:translateX(-50%);z-index:3;
 font-family:var(--f-song);font-size:25px;letter-spacing:11px;color:#4a463f;
 text-indent:11px;white-space:nowrap}
.hero{position:absolute;left:50%;top:869px;transform:translate(-50%,-50%);z-index:3;
 font-family:var(--f-brush);font-size:279px;line-height:1;color:var(--ink);white-space:nowrap}
.cinnabar-dot{position:absolute;left:calc(50% + 165px);top:calc(869px - 137px);
 width:20px;height:20px;border-radius:50%;background:var(--cinnabar);z-index:4}
.era{position:absolute;left:50%;top:1048px;transform:translateX(-50%);z-index:3;
 text-align:center;font-family:var(--f-georgia);white-space:nowrap}
.era .en{font-size:38px;letter-spacing:15px;color:#26241f;text-transform:uppercase;
 text-indent:15px}
.era .years{margin-top:15px;font-size:29px;letter-spacing:11px;color:#45423c;
 text-indent:11px}
.quote{position:absolute;left:50%;top:1176px;transform:translateX(-50%);z-index:3;
 display:flex;align-items:flex-start;gap:50px}
.vc{display:flex;flex-direction:column;align-items:center}
.vc span{font-family:var(--f-brush);font-size:85px;line-height:1.8;color:var(--ink)}
.vc.src{align-self:flex-end;padding-bottom:31px}
.vc.src span{font-family:var(--f-song);font-size:24px;line-height:1.85;color:#3d3931}
.vc.src .rot{display:block;transform:rotate(90deg);line-height:1}
.colophon{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:3;
 display:flex;flex-direction:column;align-items:center}
.cjk{font-family:var(--f-brush);font-size:42px;letter-spacing:9px;color:var(--ink);
 text-indent:9px;line-height:1}
.vdot{width:11px;height:11px;border-radius:50%;background:var(--cinnabar);margin:18px 0}
.colophon-seal{height:94px;opacity:.95;display:block}
.brand{position:absolute;left:50%;bottom:13.5%;transform:translateX(-50%);z-index:3;
 text-align:center;font-family:var(--f-georgia);white-space:nowrap}
.brand-en{font-size:50px;letter-spacing:7px;color:#26241f;text-transform:uppercase;
 text-indent:7px}
.brand-url{margin-top:18px;font-size:27px;letter-spacing:5px;color:#45423c;
 text-indent:5px}
.brand sup{font-size:.56em;letter-spacing:1px}
.mountains{position:absolute;left:0;bottom:0;width:100%;height:332px;z-index:2}
.mist{position:absolute;left:0;bottom:0;width:100%;height:460px;z-index:1}
</style></head><body><div class="stage">
