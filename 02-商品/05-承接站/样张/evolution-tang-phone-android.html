<!DOCTYPE html>
<html lang="zh-CN">
<!--
════════════════════════════════════════════════════════════════════════════
 A 线「字形演变」· 手机竖版模板 v9-phone · 1080×1920
   唯一的竖版版式出处。对应横版 `模板-朝代-v9{,-mac}.html`（1920×1080 / 1920×1248）。

 为什么单开一份（而不是给横版加个 @media）：
   竖版不是横版的「等比缩放」—— 画心由**横排**改成**竖排**（自上而下），
   金句由「右上题跋」改成「右侧一列」、落款从「左下」改贴左侧中部，
   七个区位的**相对关系全变了**。写死在一个文件里会互相打架，所以分家。

 七个区位（与横版一一对应，只是换成竖向读法）：
   ① 左上角系列标 .series-tag   = 「上 下 五 千 年 · 朝代名」（2026-10-05 用户定）
   ② 题头 .title-box            = 主标题「字 形 演 变 · 三 千 年」+ hint
   ③ 画心 .triple               = 竖排：单字朝代「碑刻宋｜毛笔」两格（商周多一格古文字）
                                   多字朝代「一字一格」，逐字交替宋/毛（char_fonts）
   ④ 右侧竖排金句 .quote        = 右起（DOM 需 reversed 写）
   ⑤ 左侧竖排列款 .colophon     = 第七境 + 朱砂点 + 印章
   ⑥ 正下中品牌行 .brand-block  = 「第七境™」+ www.theseventhrealm.com
   ⑦ 品牌行上方 .era            = 英文朝代名 + 年代

 纵向分配（1920 高）：title 顶 300 / triple 夹在 470～1590 / era 底 228 /
   brand 底 118。triple 是 `justify-content:center` 的 flex column，
   **格子数变了自动继承对称**，不需要改坐标。

 字号算法（在生成器 gen-evolution-phone.py 里，此处不持数）：
   triple 可用高 = 1920 − 470 − 330 = 1120；扣除分隔线（49px/道）后按格数平分，
   每格再刨掉 cap/sub（58px）与行高 1.06 ⇒ size = ((可用 − 线)/n − 58)/1.06，封顶 300。

 ⚠️ 与横版共用的三条硬约束（改前必读）：
   · series-tag 文案口径见 作品范式.md v13，不许写回「字 体 演 变 · X」
   · 品牌行中英分立：中文产品只写「第七境™ + www.theseventhrealm.com」（TANTSE 是英文站/历史口径）
   · 底纹商周**不走合成产线**（README §九）：用原版图，靠 `tex_pos`
     → `<img class="texture" style="object-position:center Y%">` 在成品里挪可见窗口
════════════════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="UTF-8">
<style>
@font-face{
  font-family:'Noto Serif SC Black Local';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/nssc-black.woff2') format('woff2');
  font-weight:900;
}
/* 落款/金句字体：项目字体排链首，不依赖系统是否装了 'Ma Shan Zheng'
   （2026-10-03 查明：母版字形＝马善政，与项目 MaShanZheng.ttf 骨架重合度 1.000） */
@font-face{font-family:'msz';
  src:url('file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/字体/MaShanZheng.ttf') format('truetype')}

:root{
  --white:#ffffff; --ink:#1a1a18; --ink2:#54504a;
  --cinnabar:#b03826;
  --f-brush:'msz','Ma Shan Zheng','KaiTi',serif;
  --f-body:'Noto Serif SC',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2400px;overflow:hidden;background:var(--white)}
.stage{position:relative;width:1080px;height:2400px;background:#fff;overflow:hidden}

/* ⑧ 底纹：整幅铺满，字直接压在上面（与横版同一条 CSS，只改了 mask 的椭圆比例） */
.texture{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.32;pointer-events:none;
  filter:grayscale(100%) contrast(.96);
  -webkit-mask-image:radial-gradient(ellipse 88% 62% at 52% 40%, #000 55%, transparent 100%);
  mask-image:radial-gradient(ellipse 88% 62% at 52% 40%, #000 55%, transparent 100%)}

/* ① 左上角系列标 */
.series-tag{position:absolute;left:70px;top:90px;z-index:2;
  font-family:var(--f-body);font-size:22px;letter-spacing:7px;color:#6b675f;text-indent:7px}

/* ② 题头两行（画心正上方） */
.title-box{position:absolute;left:540px;top:375px;transform:translateX(-50%);z-index:2;
  text-align:center;white-space:nowrap}
.triple-title{font-family:var(--f-body);font-size:28px;letter-spacing:12px;color:#24221d;
  text-indent:12px}
.triple-hint{margin-top:20px;font-family:var(--f-body);font-size:18px;letter-spacing:6px;
  color:#5a564e;text-indent:6px}

/* ③ 画心：竖排（自上而下＝展卷自右向左的另一读法） */
.triple{position:absolute;left:540px;top:588px;bottom:412px;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell{text-align:center;position:relative}
.song-char{font-family:'Noto Serif SC Black Local','Songti SC',serif;font-weight:900;
  color:var(--ink);line-height:1.06}
.brush-char{font-family:var(--f-brush);color:var(--ink);line-height:1.06}
.oracle-box{display:flex;align-items:flex-end;justify-content:center}
.oracle-glyph{display:block}
.cell .cap{margin-top:12px;font-family:var(--f-body);font-size:20px;letter-spacing:6px;
  color:#3d3931;text-indent:6px;white-space:nowrap}
.cell .sub{margin-top:8px;font-family:var(--f-body);font-size:15px;letter-spacing:3px;
  color:#78736a;text-indent:3px;white-space:nowrap}
.divider{width:200px;height:1px;background:#ded7c9;margin:24px auto}
/* 朱砂点睛：母版关系是「点右缘≈墨迹右缘、点顶在墨迹顶上方」→ 由生成器按字号反算内联右/顶 */
.cinnabar-dot{position:absolute;right:26px;top:2px;width:14px;height:14px;border-radius:50%;
  background:var(--cinnabar);box-shadow:14px 18px 0 -6px rgba(176,56,38,.35)}

/* ④ 右侧竖排金句（右起第一句贴最右 ⇒ DOM 必须逆序写） */
.quote{position:absolute;right:64px;top:825px;display:flex;gap:18px;align-items:flex-start;
  z-index:2}
.vc{display:flex;flex-direction:column;align-items:center;width:54px}
.vc span{font-family:var(--f-brush);font-size:46px;line-height:1.6;color:var(--ink)}
.vc.src{width:auto;align-self:flex-end;margin-bottom:-10px}
.vc.src span{font-family:var(--f-body);font-size:17px;line-height:1.6;color:#4a463f}
.vc.src .rot{display:block;transform:rotate(90deg);line-height:1}

/* ⑤ 左侧竖排列款 + 钤印 */
.colophon{position:absolute;left:56px;top:1662px;z-index:3;
  display:flex;flex-direction:column;align-items:center}
.vstack span{display:block;text-align:center;
  font-family:var(--f-brush);font-size:38px;line-height:1.4;color:var(--ink)}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--cinnabar);margin:13px 0 12px}
.colophon-seal{height:64px;opacity:.95}

/* ⑥ 正下中品牌行 */
.brand-block{position:absolute;left:540px;bottom:148px;transform:translateX(-50%);z-index:3;
  text-align:center}
.brand-cn{font-family:var(--f-brush);font-size:36px;letter-spacing:4px;color:#26241f}
.brand-cn .tm{font-family:Georgia,'Times New Roman',serif;font-size:24px;vertical-align:super;
  letter-spacing:0;margin-left:4px;color:var(--ink)}
.brand-url{margin-top:15px;font-family:Georgia,'Times New Roman',serif;font-size:20px;
  letter-spacing:3px;color:#6b675f;text-indent:3px}

/* ⑦ 品牌行上方：英文朝代名 + 年代 */
.era{position:absolute;left:540px;bottom:285px;transform:translateX(-50%);z-index:2;
  text-align:center}
.en{font-family:Georgia,'Times New Roman',serif;font-size:18px;letter-spacing:6px;
  color:#4a463f;text-indent:6px}
.years{margin-top:9px;font-family:Georgia,'Times New Roman',serif;font-size:15px;
  letter-spacing:4px;color:#6b675f;text-indent:4px}
</style>
</head>
<body>
<div class="stage">

  <div class="series-tag">上 下 五 千 年 · 唐</div>

  <div class="title-box"><div class="triple-title">字 形 演 变 · 三 千 年</div>
    <div class="triple-hint">一 字 二 体 · 碑 刻 与 毛 笔</div></div>

  <div class="triple">    <div class="cell">
      <div class="song-char" style="font-size:300px;line-height:1.06">唐</div>
      <div class="cap">今文 · 宋体</div><div class="sub">思源宋体</div>
    </div>

    <div class="divider"></div>

    <div class="cell">
      <div class="cinnabar-dot" style="right:-10px;top:0"></div>
      <div class="brush-char" style="font-size:300px;line-height:1.06">唐</div>
      <div class="cap">今文 · 毛笔</div><div class="sub">马善政楷书</div>
    </div></div>

  <div class="quote"><div class="vc src"><span>王</span><span>维</span><span class="rot">《</span><span>早</span><span>朝</span><span>大</span><span>明</span><span>宫</span><span class="rot">》</span></div>
    <div class="vc"><span>万</span><span>国</span><span>衣</span><span>冠</span></div>
    <div class="vc"><span>九</span><span>天</span><span>阊</span><span>阖</span></div></div>

  <div class="colophon">
    <div class="vstack"><span>第</span><span>七</span><span>境</span></div>
    <div class="vdot"></div>
    <img class="colophon-seal" src="file:///Users/billyhou/WorkBuddy/2026-09-25-15-56-17/02-商品/02-素材/底纹/seal.png">
  </div>

  <div class="brand-block"><div class="brand-cn">第七境<span class="tm">™</span></div>
    <div class="brand-url">www.theseventhrealm.com</div></div>

  <div class="era"><div class="en">TANG DYNASTY</div><div class="years">AD 618 – 907</div></div>
</div>
</body>
</html>
