*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#f7f5f0;color:#1a1a18;
  font-family:'serif','Noto Serif SC',Georgia,serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.mountains{position:absolute;left:0;bottom:0;width:100%;height:300px;z-index:1}
.ghost{position:absolute;left:-40px;bottom:-110px;font-family:'msz';font-size:560px;
  color:rgba(26,26,24,.045);line-height:1;z-index:2;user-select:none}
.mist{position:absolute;left:0;bottom:0;width:100%;height:300px;z-index:2;opacity:.55}
.frame{position:absolute;left:64px;top:56px;right:64px;bottom:56px;
  border:1px solid rgba(26,26,24,.10);z-index:3}
.seal{position:absolute;right:96px;bottom:112px;width:104px;z-index:6}
.brand{position:absolute;left:104px;bottom:118px;z-index:6;font-size:15px;
  letter-spacing:4px;color:#4a463f;font-family:'serif'}
.brand b{font-family:'msz';font-weight:400;font-size:23px;letter-spacing:7px;color:#1a1a18}
.brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b03826;
  margin:0 10px;vertical-align:middle}
.series{position:absolute;left:104px;top:104px;font-size:16px;letter-spacing:8px;
  color:#4a463f;z-index:6;font-family:'serif'}
.series em{font-family:'msz';font-style:normal;font-size:30px;letter-spacing:4px;color:#1a1a18}

.quat{position:absolute;left:0;right:0;top:352px;z-index:5;
  display:flex;justify-content:center;align-items:flex-end;gap:104px}
.cell{text-align:center}
/* ⚠️ 固定 height:232px 是「逐格光学归一化」的地基：四格行盒顶边恒定在 y=352，
   字号变大只让字向下溢出（overflow 可见）、不推动下方标签，
   于是「墨迹底 = 352 + c·字号/232」成为可精确求解的线性关系。 */
.cell .ch{font-size:232px;line-height:1;color:#1a1a18;height:232px}
.cell .lb{margin-top:26px;font-size:14px;letter-spacing:6px;color:#8c8578;font-family:'serif'}
.cell .lb b{display:block;font-weight:400;font-size:11px;letter-spacing:3px;color:#b3aca0;margin-top:6px}
.rule{position:absolute;left:50%;transform:translateX(-50%);top:700px;width:900px;height:1px;
  background:rgba(26,26,24,.14);z-index:5}
.meta{position:absolute;left:50%;transform:translateX(-50%);top:740px;z-index:5;
  display:flex;align-items:center;gap:34px;font-size:17px;letter-spacing:5px;color:#4a463f;font-family:'serif'}
.meta .num{font-family:'serif';font-weight:600;font-size:30px;letter-spacing:9px;color:#1a1a18}
.meta .dot{width:5px;height:5px;border-radius:50%;background:#b03826}
.quote{position:absolute;right:118px;top:300px;writing-mode:vertical-rl;
  font-family:'msz';font-size:40px;letter-spacing:16px;color:#1a1a18;z-index:5;line-height:1.7}
.src{position:absolute;right:176px;top:300px;writing-mode:vertical-rl;
  font-size:13px;letter-spacing:5px;color:#8c8578;z-index:5;line-height:2.1;font-family:'serif'}

/* ── 人物底纹层（v3 实验）─────────────────────────────
   素材是**带 alpha 的墨迹层**（底色全透明），所以不需要任何混合模式：
   直接叠加即无缝，深浅只由 opacity 控制。 */
.figure{position:absolute;z-index:2;pointer-events:none}

/* ① 底纹永远在右侧：整幅进画（right:0 / bottom:0），人物主体压中线右侧 */
.figure{right:0;bottom:0;height:1000px;opacity:.215}
/* ② 金句与出处上提到右上角，与左上角系列标齐平 */
.quote{top:104px}
.src{top:104px}
/* ⑤ 左下角落款：竖排毛笔「第七境」+ 朱砂点 + 印章 —— 照抄商/周 v9 .colophon */
.seal{display:none}                 /* 旧右下角大印作废：落款改用商周同款小印 */
.brand{display:none}                /* 旧横排「第七境™」作废 */
.colophon{position:absolute;left:210px;bottom:140px;z-index:6;
  display:flex;flex-direction:column;align-items:flex-start}
.vstack{display:flex;flex-direction:column;align-items:center}
.vstack span{display:block;text-align:center}
.vstack.cjk span{font-family:'msz';font-size:40px;line-height:1.44;color:#1a1a18}
.vdot{width:10px;height:10px;border-radius:50%;background:#b03826;
  margin:16px 0 14px 14px;flex:0 0 auto}
.colophon-seal{height:70px;opacity:.95}
/* ⑥ 正下方中间：品牌行 + 网址行 —— 照抄商/周 v9 .brand-block */
.brand-block{position:absolute;left:960px;bottom:140px;transform:translateX(-50%);z-index:6;
  text-align:center;font-family:Georgia,'Times New Roman',serif}
.brand-en{font-size:33px;letter-spacing:9px;color:#26241f;text-transform:uppercase;
  text-indent:16px}
.brand-url{margin-top:13px;font-size:18px;letter-spacing:5px;color:#45423c;text-indent:5px}

<script>
window.addEventListener('load', function () {
  var sels = [".colophon", ".colophon .vstack.cjk", ".colophon .vstack.cjk span", ".colophon .vdot", ".colophon-seal", ".brand-block", ".brand-block .brand-en", ".brand-block .brand-url"];
  var out = [];
  sels.forEach(function (s) {
    var e = document.querySelector(s);
    if (!e) { out.push(s + '=NONE'); return; }
    var r = e.getBoundingClientRect();
    out.push([s, r.left, r.top, r.width, r.height].map(function (v, i) {
      return i ? (+v).toFixed(1) : v; }).join(' '));
  });
  var d = document.createElement('div');
  d.textContent = 'RECTS|' + out.join('|');
  document.body.appendChild(d);
});

</script>
