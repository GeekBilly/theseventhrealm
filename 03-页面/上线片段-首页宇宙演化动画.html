<style>
.qjcos-hero{position:relative;width:100%;max-width:1200px;aspect-ratio:1200/500;margin:0 auto;overflow:hidden}
.qjcos-scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.qjcos-st{opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .qjcos-st{animation:qjcos-fade 1.4s ease forwards}
  .qjcos-mist{animation-delay:0s;animation-duration:3.4s;animation-name:qjcos-mistflow}
  .qjcos-core{animation-delay:1.6s;animation-name:qjcos-grow}
  .qjcos-dual{animation-delay:4s;animation-name:qjcos-unfold}
  .qjcos-triad{animation-delay:7s;animation-name:qjcos-grow}
  .qjcos-stars{animation-delay:9.8s;animation-duration:2.2s}
  .qjcos-earth{animation-delay:13.6s;animation-name:qjcos-grow}
  .qjcos-glyph{animation-delay:15.8s;animation-duration:2.4s}
  .qjcos-par{animation:qjcos-burst 2.6s cubic-bezier(.16,.84,.3,1) forwards}
  .qjcos-cap{animation:qjcos-capshow 3s ease forwards}
  .qjcos-c1{animation-delay:.2s} .qjcos-c2{animation-delay:3.2s}
  .qjcos-c3{animation-delay:5.4s} .qjcos-c4{animation-delay:8.4s}
  .qjcos-c5{animation-delay:11.6s} .qjcos-c6{animation-delay:15s}
  .qjcos-stmt{animation:qjcos-fade 1.6s ease forwards;animation-delay:18.4s}
}
@media (prefers-reduced-motion:reduce){.qjcos-st,.qjcos-par{opacity:.85}.qjcos-stmt{opacity:1}}
@keyframes qjcos-fade{from{opacity:0}to{opacity:1}}
@keyframes qjcos-mistflow{0%{opacity:0}18%{opacity:.85}70%{opacity:.22}100%{opacity:.10}}
@keyframes qjcos-grow{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes qjcos-unfold{from{opacity:0;transform:scale(.15) rotate(-40deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes qjcos-burst{0%{opacity:0;transform:translate(0,0) scale(.2)}22%{opacity:.9}100%{opacity:.85;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes qjcos-capshow{0%{opacity:0}16%{opacity:1}72%{opacity:1}100%{opacity:0}}
.qjcos-par{opacity:0;transform-box:fill-box;transform-origin:center}
.qjcos-cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;letter-spacing:.32em;color:#a39d92;opacity:0}
.qjcos-stmt{max-width:1200px;margin:8px auto 0;padding:54px 24px 0;text-align:center;border-top:1px solid #e6e2d8;opacity:0}
.qjcos-lead{font-family:'Ma Shan Zheng','Xingkai SC','STXingkai','KaiTi','STKaiti',serif;font-size:clamp(24px,3.6vw,44px);line-height:1.7;color:#1a1a18;letter-spacing:.10em}
.qjcos-sub{margin-top:16px;font-size:clamp(12px,1.2vw,15px);letter-spacing:.18em;color:#6b675f;line-height:2}
.qjcos-acts{margin-top:30px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.qjcos-acts a{display:inline-block;padding:14px 32px;border-radius:2px;font-size:15px;letter-spacing:.16em;text-decoration:none;transition:.25s}
.qjcos-acts .p{background:#b03826;color:#fff}
.qjcos-acts .p:hover{background:#1a1a18}
.qjcos-acts .s{border:1px solid #a39d92;color:#6b675f}
.qjcos-acts .s:hover{border-color:#1a1a18;color:#1a1a18}
</style>
